<!doctype html><html><head><style>body{font-family:var(--font-sans);color:var(--foreground)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;padding:8px 12px;border:1px solid var(--border);border-radius:6px;color:var(--foreground);background:var(--secondary);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}img{width:100%;display:block;border-radius:6px}.phone{width:260px;max-width:100%;margin:auto}p{color:var(--muted-foreground);font-size:13px;line-height:1.5}</style></head><body><nav><button onclick="show('1920',this)" aria-pressed=true>1920</button><button onclick="show('1280',this)">1280</button><button onclick="show('390',this)">Phone</button><button onclick="show('sheet',this)">All 30 cars</button></nav><img id=shot src="./after/menu-1920.png"><p id=note>Selected MINI, saved red paint. Hero, Garage and Ready to Drive use one identity. DEV appears once.</p><script>const images={ '1920':'./after/menu-1920.png','1280':'./after/menu-1280.png','390':'./after/menu-390.png','sheet':'./hero-sheet.png'};function show(id,b){document.querySelectorAll('button').forEach(e=>e.setAttribute('aria-pressed',e===b));shot.src=images[id];shot.className=id==='390'?'phone':'';note.textContent=id==='sheet'?'All 30 garage entries. Live in-game models with paint, environment reflections and tinted glass.':'Selected MINI, saved red paint. Hero, Garage and Ready to Drive use one identity. DEV appears once.'}</script></body></html>
