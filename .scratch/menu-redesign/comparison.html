<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:var(--font-sans,system-ui);color:var(--foreground);margin:0}nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}button{font:inherit;font-size:12px;padding:7px 12px;border:1px solid var(--border,#555);border-radius:6px;background:var(--secondary,#222);color:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--primary,#d9f653);color:var(--primary-foreground,#101810)}.pair{display:none;grid-template-columns:1fr 1fr;gap:12px}.pair.on{display:grid}figure{margin:0;min-width:0}figcaption{font-size:12px;color:var(--muted-foreground);margin:0 0 8px}img{display:block;width:100%;height:auto;border-radius:5px}.note{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin:12px 0 0}
</style></head><body><nav aria-label="Screenshot size"><button aria-pressed="true" onclick="show(0)">1280 × 800</button><button aria-pressed="false" onclick="show(1)">1920 × 1080</button><button aria-pressed="false" onclick="show(2)">390 px phone</button></nav>
<div class="pair on"><figure><figcaption>Before</figcaption><img src="before/menu-1280.png" alt="Original glass card menu at 1280 pixels"></figure><figure><figcaption>After</figcaption><img src="after/menu-1280.png" alt="Redesigned compact racing menu at 1280 pixels"></figure></div>
<div class="pair"><figure><figcaption>Before</figcaption><img src="before/menu-1920.png" alt="Original menu at 1920 pixels"></figure><figure><figcaption>After</figcaption><img src="after/menu-1920.png" alt="Redesigned menu at 1920 pixels"></figure></div>
<div class="pair"><figure><figcaption>Before</figcaption><img src="before/menu-390.png" alt="Original phone menu"></figure><figure><figcaption>After</figcaption><img src="after/menu-390.png" alt="Redesigned phone menu with visible account button"></figure></div>
<p class="note">28 KB hero · zero boot worlds, geometries or game-renderer textures. Cold latency parity remains unverified under shared-host load. The featured car is static; a real Riviera cinematic would add more life.</p>
<script>function show(n){document.querySelectorAll('.pair').forEach((p,i)=>p.classList.toggle('on',i===n));document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===n?'true':'false'))}</script></body></html>
