<!doctype html><html><head><meta charset="utf-8"><style>
body{font:13px/1.45 var(--font-sans,system-ui);color:var(--foreground);margin:0}button{font:inherit;cursor:pointer;padding:7px 10px;border:1px solid var(--border,#43515b);border-radius:5px;background:var(--secondary,#1e2a32);color:var(--foreground,#edf3f6)}button[aria-pressed=true]{background:var(--primary,#dafa4a);color:var(--primary-foreground,#15200a);border-color:transparent}button:focus-visible{outline:2px solid var(--ring,#dafa4a);outline-offset:2px}.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.muted{color:var(--muted-foreground,#a5b7c1);margin:8px 0}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel{background:var(--card,#13212b);border-radius:var(--radius,8px);padding:16px;min-width:0}.panel b{display:block;font-size:11px;letter-spacing:.09em;margin-bottom:12px}.panel img{display:block;max-width:100%;max-height:240px;width:auto;margin:auto;object-fit:contain}.pose img{width:100%;max-height:490px;object-fit:contain;display:block}.hidden{display:none!important}@media(max-width:500px){.pairs{grid-template-columns:1fr}.panel img{max-height:200px}button{padding:6px 8px}}
</style></head><body><div class="row" id="modes"></div><p class="muted" id="description"></p><div id="types"><div class="row" id="groups"></div><div class="row" id="names"></div><div class="pairs"><div class="panel"><b>BEFORE</b><img id="before" alt="Before"></div><div class="panel"><b>AFTER</b><img id="after" alt="After"></div></div></div><div id="placement" class="hidden"><div class="row" id="sizes"></div><div class="row" id="cameras"></div><div class="row" id="versions"></div><div class="pose"><img id="pose" alt="Notice placement"></div></div><script>
const images={"engine-disabled": {"before": "before/engine-disabled.png", "after": "after/engine-disabled.png"}, "engine-hot": {"before": "before/engine-hot.png", "after": "after/engine-hot.png"}, "limp-mode": {"before": "before/limp-mode.png", "after": "after/limp-mode.png"}, "body-damage": {"before": "before/body-damage.png", "after": "after/body-damage.png"}, "tow": {"before": "before/tow.png", "after": "after/tow.png"}, "tow-minimised": {"before": "before/tow-minimised.png", "after": "after/tow-minimised.png"}, "offtrack": {"before": "before/offtrack.png", "after": "after/offtrack.png"}, "police-pursuit": {"before": "before/police-pursuit.png", "after": "after/police-pursuit.png"}, "police-cooldown": {"before": "before/police-cooldown.png", "after": "after/police-cooldown.png"}, "police-busted": {"before": "before/police-busted.png", "after": "after/police-busted.png"}, "checkpoint": {"before": "before/checkpoint.png", "after": "after/checkpoint.png"}, "objective": {"before": "before/objective.png", "after": "after/objective.png"}, "objective-complete": {"before": "before/objective-complete.png", "after": "after/objective-complete.png"}, "wrong-way": {"before": "before/wrong-way.png", "after": "after/wrong-way.png"}, "phone-connected": {"before": "before/phone-connected.png", "after": "after/phone-connected.png"}, "phone-disconnected": {"before": "before/phone-disconnected.png", "after": "after/phone-disconnected.png"}, "invite": {"before": "before/invite.png", "after": "after/invite.png"}, "opa": {"before": "before/opa.png", "after": "after/opa.png"}, "offline": {"before": "before/offline.png", "after": "after/offline.png"}, "traction-control": {"before": "before/traction-control.png", "after": "after/traction-control.png"}, "gearbox": {"before": "before/gearbox.png", "after": "after/gearbox.png"}, "music": {"before": "before/music.png", "after": "after/music.png"}, "tip": {"before": "before/tip.png", "after": "after/tip.png"}, "speed-camera": {"before": "before/speed-camera.png", "after": "after/speed-camera.png"}, "signal": {"before": "before/signal.png", "after": "after/signal.png"}, "pedestrian": {"before": "before/pedestrian.png", "after": "after/pedestrian.png"}, "recovered": {"before": "before/recovered.png", "after": "after/recovered.png"}, "camera": {"before": "before/camera.png", "after": "after/camera.png"}, "controller": {"before": "before/controller.png", "after": "after/controller.png"}, "abs": {"before": "before/abs.png", "after": "after/abs.png"}, "unsafe-shift": {"before": "before/unsafe-shift.png", "after": "after/unsafe-shift.png"}, "shift-rejected": {"before": "before/shift-rejected.png", "after": "after/shift-rejected.png"}, "split": {"before": "before/split.png", "after": "after/split.png"}, "rival": {"before": "before/rival.png", "after": "after/rival.png"}, "finish": {"before": "before/finish.png", "after": "after/finish.png"}, "district": {"before": "before/district.png", "after": "after/district.png"}, "bump": {"before": "before/bump.png", "after": "after/bump.png"}, "takedown": {"before": "before/takedown.png", "after": "after/takedown.png"}, "nitro": {"before": "before/nitro.png", "after": "after/nitro.png"}, "retired": {"before": "before/retired.png", "after": "after/retired.png"}, "police-warning": {"before": "before/police-warning.png", "after": "after/police-warning.png"}, "police-observing": {"before": "before/police-observing.png", "after": "after/police-observing.png"}, "police-evaded": {"before": "before/police-evaded.png", "after": "after/police-evaded.png"}, "pickup": {"before": "before/pickup.png", "after": "after/pickup.png"}, "session": {"before": "before/session.png", "after": "after/session.png"}},poses={"1280-chase": {"before": "before/placement-chase-1280.png", "after": "after/placement-chase-1280.png"}, "1280-cockpit": {"before": "before/placement-cockpit-1280.png", "after": "after/placement-cockpit-1280.png"}, "1920-chase": {"before": "before/placement-chase-1920.png", "after": "after/placement-chase-1920.png"}, "1920-cockpit": {"before": "before/placement-cockpit-1920.png", "after": "after/placement-cockpit-1920.png"}, "390-chase": {"before": "before/placement-chase-390.png", "after": "after/placement-chase-390.png"}, "390-cockpit": {"before": "before/placement-cockpit-390.png", "after": "after/placement-cockpit-390.png"}, "844-chase": {"before": "before/placement-chase-844.png", "after": "after/placement-chase-844.png"}, "844-cockpit": {"before": "before/placement-cockpit-844.png", "after": "after/placement-cockpit-844.png"}},groups={"Recovery": ["engine-disabled", "engine-hot", "limp-mode", "body-damage", "tow", "tow-minimised", "offtrack", "recovered"], "Police": ["police-pursuit", "police-cooldown", "police-busted", "police-warning", "police-observing", "police-evaded", "takedown", "speed-camera"], "Road": ["checkpoint", "objective", "objective-complete", "wrong-way", "split", "finish", "district", "pickup", "session", "signal"], "Connection": ["phone-connected", "phone-disconnected", "invite", "offline", "controller"], "Driving": ["opa", "traction-control", "gearbox", "music", "tip", "pedestrian", "camera", "abs", "unsafe-shift", "shift-rejected", "rival", "bump", "nitro", "retired"]};let mode='Notice types',group='Recovery',name='engine-disabled',size=1280,camera='chase',version='after';const label=s=>s.replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase());
function buttons(id,values,selected,pick){const root=document.getElementById(id);root.replaceChildren();for(const value of values){const b=document.createElement('button');b.type='button';b.textContent=label(String(value));b.setAttribute('aria-pressed',String(value===selected));b.onclick=()=>{pick(value);render()};root.append(b)}}
function render(){buttons('modes',['Notice types','Placement'],mode,v=>mode=v);document.getElementById('types').classList.toggle('hidden',mode!=='Notice types');document.getElementById('placement').classList.toggle('hidden',mode==='Notice types');document.getElementById('description').textContent=mode==='Notice types'?'45 real notice variants, isolated on the same background. The earlier UI had no phone-disconnection notice.':'Real scene and HUD. Four viewport sizes, both camera views; phone captures include touch controls.';buttons('groups',Object.keys(groups),group,v=>{group=v;name=groups[v][0]});buttons('names',groups[group],name,v=>name=v);for(const p of ['before','after']){document.getElementById(p).src=images[name][p];document.getElementById(p).alt=label(name)+' '+p}buttons('sizes',[1280,1920,390,844],size,v=>size=v);buttons('cameras',['chase','cockpit'],camera,v=>camera=v);buttons('versions',['before','after'],version,v=>version=v);document.getElementById('pose').src=poses[size+'-'+camera][version];}
render();console.assert(Object.keys(images).length===45,'All notice variants present');
</script></body></html>
