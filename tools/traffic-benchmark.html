<!doctype html><html><head><meta charset="utf-8"><title>Traffic renderer benchmark</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body style="margin:0"><script type="module">
import * as THREE from 'three';
const baseline=new URLSearchParams(location.search).has('baseline');
const {Traffic}=await import(baseline?'../.scratch/traffic-models/baseline/src/traffic.js':'../src/traffic.js');
const scene=new THREE.Scene();scene.background=new THREE.Color('#9babbd');scene.add(new THREE.HemisphereLight(0xffffff,0x47474a,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-10,20,10);scene.add(sun);
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(960,600);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(55,960/600,.1,1000);camera.position.set(0,5,18);camera.lookAt(0,1,-60);
const route={start:0,finish:0,project:(x,z)=>({s:-z,u:x}),frame:(s,o)=>Object.assign(o,{tx:0,tz:-1,rx:1,rz:0,grade:0,bank:0}),point:(s,u,v)=>v.set(u,0,-s),curv:()=>0};
const spots=Array.from({length:772},(_,i)=>({x:(i%8<4?-1:1)*(10+(i%4)*3),z:-Math.floor(i/8)*6,yaw:0}));
const begin=performance.now(),traffic=new Traffic(scene,route,{parkSpots:spots});const poolMs=performance.now()-begin;
const parkingStart=performance.now();traffic.buildParkedRows(scene,{at:()=>({y:0})});const parkingMs=performance.now()-parkingStart;
for(const [i,c] of traffic.cars.entries()){c.active=true;c.s=12+Math.floor(i/4)*22;c.u=(i%4-1.5)*3.5;c.dir=1;c.wheel=0;c.v=10;c.yawLC=0;}
traffic.sync(0);scene.updateMatrixWorld(true);
const road=new THREE.Mesh(new THREE.PlaneGeometry(70,1300).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:'#515458',roughness:1}));road.position.set(0,-.04,-400);scene.add(road);
const gl=renderer.getContext();renderer.compile(scene,camera);
const samples=[];for(let i=0;i<25;i++){const t=performance.now();traffic.sync(0);renderer.render(scene,camera);gl.finish();if(i>=5)samples.push(performance.now()-t);await new Promise(r=>setTimeout(r,10));}
samples.sort((a,b)=>a-b);const ext=gl.getExtension('WEBGL_debug_renderer_info');
window.benchmark={baseline,pool:traffic.cars.length,parked:spots.length,poolMs,parkingMs,medianMs:samples[10],p95Ms:samples[18],calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures,gpu:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):null,samples};
console.log('TRAFFIC_BENCHMARK',JSON.stringify(window.benchmark));window.scene=scene;window.camera=camera;window.renderer=renderer;
</script></body></html>
