<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
body{margin:0;background:#aec1c7;color:#f6f3e9;font:13px system-ui}canvas{display:block}aside{position:absolute;top:16px;left:16px;width:290px;background:#172729ed;padding:18px;border-radius:10px;box-shadow:0 8px 30px #0002}h1{font-size:17px;margin:0 0 12px}select,button{font:inherit;padding:7px;background:#f1eedf;color:#203839;border:0;border-radius:4px}select{width:100%;margin:5px 0 12px}button{cursor:pointer;margin:8px 8px 0 0}p{line-height:1.5;margin:8px 0}small{color:#beccc5}#status{font-variant-numeric:tabular-nums;white-space:pre-line}a{color:#e4d4a2}label{display:block;margin:7px 0}#error{color:#ffa58b}footer{position:absolute;bottom:12px;right:18px;color:#223d42;background:#edf0e1d9;padding:8px 12px;border-radius:5px}
</style></head><body>
<aside><h1>PARALIAKI / Roadside atelier</h1><small>Full-size procedural models · metres</small>
<select id="model" aria-label="Model"><option value="all">All models</option><option value="shelter">OASA shelter · 4.55 × 2.02 m</option><option value="stop">OASA stop pole · 2.94 m</option><option value="parking">Parking sign</option><option value="bin">Litter bin · 0.86 m</option><option value="canteen">Limanakia canteen trailer</option><option value="stairs">Cove stairs · 18 treads</option><option value="wall">Mortared limestone retaining wall</option><option value="villa">Whitewashed villa wall and iron fence</option><option value="shack">Lomvarda timber beach bar</option><option value="map">Map placement / terrain</option></select>
<label><input id="boxes" type="checkbox"> Show collision boxes</label><label><input id="spin" type="checkbox"> Turntable</label>
<button id="reset">Reset camera</button><button id="next" hidden>Next landmark</button>
<p id="status">Loading textures…</p><p id="error"></p><small>Drag to orbit · wheel to zoom · right-drag to pan.<br>Map mode uses the current data/map.json and terrain.bin.</small>
<p><a href="https://2steps.gr/index.asp?xkey=3680" target="_blank" rel="noreferrer">Limanakia reference</a> · <a href="https://www.lifo.gr/guide/nightlife/recommendations/mojito-bay" target="_blank" rel="noreferrer">Lomvarda reference</a></p></aside>
<footer>Concrete · limestone · galvanized steel · painted timber</footer>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createRoadsideModels, buildRoadside } from './src/roadside.js';
import { loadTextures } from './src/tex.js';
import { loadMap } from './src/map.js';
import { buildTerrain } from './src/terrain.js';
const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#afc4cc');
const pmrem=new THREE.PMREMGenerator(renderer), env=pmrem.fromScene(new RoomEnvironment(),.04);scene.environment=env.texture;scene.environmentIntensity=.65;pmrem.dispose();
const sun=new THREE.DirectionalLight('#fff4dc',3);sun.position.set(-12,22,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-28,right:28,top:25,bottom:-25,near:1,far:100});sun.shadow.bias=-.00015;sun.shadow.normalBias=.025;scene.add(sun);scene.add(sun.target);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,2500),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(160,160).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:'#b8b39e',roughness:1}));floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(80,80,'#aaa890','#b5b39d');grid.position.y=-.032;scene.add(grid);
let root=new THREE.Group(), collision=new THREE.Group(), mapResult=null, terrain=null, landmark=0, current='all';scene.add(root,collision);
const errors=[];window.addEventListener('error',e=>{errors.push(e.message);$('error').textContent=e.message;});
await loadTextures();const library=createRoadsideModels();
function box(o,y=0,h=1.2){const mesh=new THREE.Mesh(new THREE.BoxGeometry(o.hw*2,h,o.hl*2),new THREE.MeshBasicMaterial({color:'#ff5c33',wireframe:true,depthTest:false,transparent:true,opacity:.8}));mesh.position.set(o.x,y+h/2,o.z);mesh.rotation.y=o.yaw;collision.add(mesh);}
function addModel(name,x,z){const model=library.models[name],g=new THREE.Group();g.position.set(x,name==='stairs'?2.9:0,z);root.add(g);for(const p of model.parts){const mesh=new THREE.Mesh(p.geometry,p.material);mesh.castShadow=p.key!=='glass';mesh.receiveShadow=true;g.add(mesh);}for(const o of model.obstacles)box({...o,x:o.x+x,z:o.z+z},0);return g;}
function aim(center,d){const a=+(Q.get('a')||32)*Math.PI/180,e=+(Q.get('e')||25)*Math.PI/180;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(Math.sin(a)*Math.cos(e)*d,Math.sin(e)*d,Math.cos(a)*Math.cos(e)*d));camera.far=current==='map'?2500:500;camera.updateProjectionMatrix();controls.update();sun.target.position.copy(center);sun.position.copy(center).add(new THREE.Vector3(-12,22,15));}
function focus(){if(current==='map'&&mapResult){const ps=mapResult.group.userData.placements;const p=ps[landmark%ps.length];if(p)aim(new THREE.Vector3(p.x,p.y+1,p.z),24);return;}const bounds=new THREE.Box3().setFromObject(root),center=bounds.getCenter(new THREE.Vector3());const size=bounds.getSize(new THREE.Vector3());aim(center,+(Q.get('d')||Math.max(5,Math.max(size.x,size.z)*1.9)));}
async function show(name){current=name;$('model').value=name;$('status').textContent='Building…';$('error').textContent='';root.clear();collision.clear();if(mapResult)mapResult.group.visible=false;if(terrain)terrain.group.visible=false;floor.visible=grid.visible=name!=='map';$('next').hidden=name!=='map';
try{if(name==='map'){
 if(!mapResult){const map=await loadMap();if(!map.data.zones){$('error').textContent='Old map: no zones; using a viewer-only coastal/town fallback. Missing landmark props are intentionally skipped.';const lim=map.data.marks.find(m=>m.id==='limanakia')?.s??Infinity;map.route.urban=s=>s<lim-500?.8:.1;map.route.district=s=>s<lim-500?'town':'cliff';}
 terrain=buildTerrain(map.terrain,map.route,[],scene);mapResult=buildRoadside(map,scene,terrain.heightC,{});window.__roadside.map=map;window.__roadside.result=mapResult;window.__roadside.heightC=terrain.heightC;
 const roadGeo=new THREE.BufferGeometry(),pos=[];for(let s=0;s<map.route.length-5;s+=5){const a=map.route.point(s,-map.route.edge(s)),b=map.route.point(s,map.route.edge(s)),c=map.route.point(s+5,-map.route.edge(s+5)),d=map.route.point(s+5,map.route.edge(s+5));for(const p of [a,c,b,b,c,d])pos.push(p.x,p.y+.035,p.z);}roadGeo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));roadGeo.computeVertexNormals();const road=new THREE.Mesh(roadGeo,new THREE.MeshStandardMaterial({color:'#555957',roughness:1,side:THREE.DoubleSide}));terrain.group.add(road);
 }
 mapResult.group.visible=true;terrain.group.visible=true;for(const o of mapResult.obstacles)box(o,terrain.heightC(o.x,o.z));
}else if(name==='all'){for(const [n,x,z] of [['shelter',-7,-5],['canteen',0,-5],['shack',8,-5],['wall',-7,2],['villa',0,2],['stairs',8,2],['stop',-8,7],['parking',-5,7],['bin',-2,7]])addModel(n,x,z);floor.position.y=-.04;grid.position.y=-.032;
}else{addModel(name,0,0);floor.position.y=-.04;grid.position.y=floor.position.y+.008;}
collision.visible=$('boxes').checked;focus();window.__roadside.ready=true;
}catch(e){$('error').textContent=e.stack;errors.push(e.message);}
}
window.__roadside={renderer,scene,camera,controls,library,errors,ready:false,show};
$('model').onchange=e=>show(e.target.value);$('reset').onclick=focus;$('next').onclick=()=>{landmark++;focus();};$('boxes').onchange=()=>collision.visible=$('boxes').checked;$('spin').onchange=e=>controls.autoRotate=e.target.checked;
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
await show(Q.get('model')||'all');let last=0;
renderer.setAnimationLoop(time=>{controls.update();renderer.render(scene,camera);if(time-last>500){last=time;const info=renderer.info.render;let text=`${info.calls} draw calls (scene main pass)\n${info.triangles.toLocaleString()} triangles`;if(current==='map'&&mapResult){const s=mapResult.group.userData.roadside;text+=`\n${s.obstacles} collision boxes · ${s.meshes} instanced batches\n`+Object.entries(s.counts).map(([k,v])=>`${k}: ${v}`).join(' · ');}else if(library.models[current]){const m=library.models[current];text+=`\n${m.parts.length} material batches · ${m.obstacles.length} collision boxes`;} $('status').textContent=text;}});
</script></body></html>
