<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>people lab</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>html,body{margin:0;background:#9cb3c6;overflow:hidden}</style></head>
<body><script type="module">
// Dev page: a line-up of crowd figures in every pose. ?t=seconds freezes time; ?cam=side|front|close
import * as THREE from 'three';
import { Crowd, makeLook, newPose, poseWalk, poseStand, poseSit, poseLie, poseSwim, armsPanic, armsFist, armsWave, starfish, HIP_Y } from '../src/human.js';
import { RNG } from '../src/util.js';
const Q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9cb3c6');
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200);
const mode = Q.get('cam') || 'front';
if (mode === 'front') { cam.position.set(0, 1.4, 11); cam.lookAt(0, 0.9, 0); }
else if (mode === 'side') { cam.position.set(11, 1.3, 0.5); cam.lookAt(0, 0.9, 0.5); }
else { cam.position.set(-3.2, 1.6, 3.2); cam.lookAt(-3.4, 1.2, 0); }
scene.add(new THREE.HemisphereLight('#dfefff', '#8a7a60', 1.2));
const sun = new THREE.DirectionalLight('#fff4e0', 2.6); sun.position.set(5, 10, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 8, bottom: -4 }); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), new THREE.MeshStandardMaterial({ color: '#b9b2a4' })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const crowd = new Crowd(scene, 40);
const rng = new RNG(+(Q.get('seed') || 5));
const cfg = ['walk', 'walk', 'run', 'idle', 'chat', 'phone', 'sit', 'panic', 'fist', 'wave', 'star', 'lie', 'walk', 'walk'];
const ppl = cfg.map((m, i) => { const L = makeLook(rng, i === 11 || i === 13 ? 'beach' : 'street'); return { m, L, P: newPose(), x: (i - (cfg.length - 1) / 2) * 1.05 }; });
const T0 = performance.now();
function frame() {
  const t = Q.has('t') ? +Q.get('t') : (performance.now() - T0) / 1000;
  crowd.begin();
  ppl.forEach((p, i) => {
    const P = p.P; Object.assign(P, newPose());
    P.x = p.x; P.z = 0; P.yaw = mode === 'side' ? 0 : 0.35;
    if (p.m === 'walk') poseWalk(P, t * 5 + i, 1);
    else if (p.m === 'run') poseWalk(P, t * 9, 1, true);
    else if (p.m === 'idle') poseStand(P, t, i * 0.1, 'idle');
    else if (p.m === 'chat') poseStand(P, t, i * 0.1, 'chat');
    else if (p.m === 'phone') poseStand(P, t, i * 0.1, 'phone');
    else if (p.m === 'sit') poseSit(P, t, i);
    else if (p.m === 'panic') { poseStand(P, t, 1); armsPanic(P, t); }
    else if (p.m === 'fist') { poseStand(P, t, 1); armsFist(P, t); }
    else if (p.m === 'wave') { poseStand(P, t, 1); armsWave(P, t); }
    else if (p.m === 'star') { starfish(P, t); P.y = 0.5; P.roll = 0.6; }
    else if (p.m === 'lie') { poseLie(P, t, 0.6); P.pitch = -Math.PI / 2; P.y = 0.4 + 0.12 - HIP_Y * p.L.k; P.yaw = 0; }
    crowd.draw(P, p.L);
  });
  crowd.end();
  r.render(scene, cam);
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
