<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Riviera people · model review</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#b9c4c9;color:#20313a;font:16px system-ui}canvas{display:block}header{position:absolute;top:20px;left:28px}h1{font-size:23px;margin:0 0 8px}p{margin:0}footer{position:absolute;bottom:20px;display:flex;width:100%;text-align:center}footer span{width:33.333%}</style></head>
<body><header><h1 id="title">Riviera people</h1><p id="detail">Front · profile · face and clothing</p></header><footer><span>FRONT</span><span>PROFILE</span><span>DETAIL</span></footer>
<script type="module">
import * as THREE from 'three';
import * as H from '../src/human.js';
import {RNG} from '../src/util.js';
import {TX} from '../src/tex.js';
await Promise.all(['nor','arm'].map(async name=>{const tex=await new THREE.TextureLoader().loadAsync('/assets/tex/fabric_leather_02_'+name+'.webp');tex.wrapS=tex.wrapT=THREE.RepeatWrapping;TX['leather_'+name]=tex;}));
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#b9c4c9');scene.add(new THREE.HemisphereLight('#f3f6fa','#8c8373',2));const sun=new THREE.DirectionalLight('#fff5e6',3);sun.position.set(3,6,4);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:'#bbb6ac',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;scene.add(floor);
const crowd=new H.Crowd(scene,150), cameras=[0,1,2].map(()=>new THREE.PerspectiveCamera(32,innerWidth/3/innerHeight,.01,500));
const variants=[
{name:'Summer linen · local',ctx:'street',seed:4,sex:false},
{name:'Summer dress · local',ctx:'street',seed:16,sex:true,skirt:true},
{name:'Beach · swim shorts and towel',ctx:'beach',seed:21,sex:false,towel:true},
{name:'Beach · swimsuit and sun hat',ctx:'beach',seed:23,sex:true,hat:'sun'},
{name:'Older local · summer shirt',ctx:'elder',seed:10,sex:false},
{name:'Older local · summer dress',ctx:'elder',seed:15,sex:true,skirt:true},
{name:'Child · promenade',ctx:'child',seed:32},
{name:'Jogger · running kit',ctx:'jogger',seed:42},
{name:'Cyclist · promenade bicycle',ctx:'cyclist',seed:57},
{name:'Café customer · seated',ctx:'cafe',seed:4,sit:true},
{name:'Bus stop · phone check',ctx:'street',seed:69,phone:true,bag:true},
{name:'Beach · parasol and beach bag',ctx:'beach',seed:81,sex:true,umbrella:true,bag:true}
];
let current;
function setup(index=0){const v=variants[index],rng=new RNG(v.seed);let L;for(let i=0;i<200;i++){L=H.makeLook(rng,v.ctx);if((v.sex===undefined||L.female===v.sex)&&(!v.skirt||L.skirt)&&(!v.ctx.includes('beach')||!L.old&&!L.kid))break;}
for(const k of ['towel','hat','phone','bag','umbrella'])if(k in v)L[k]=v[k];if(v.phone)L.cup=false;L.u=null;
const P=H.newPose();if(v.ctx==='jogger')H.poseWalk(P,1.1,1,true);else if(v.ctx==='cyclist')H.poseCycle(P,1.4);else if(v.sit)H.poseSit(P,1.2,.4,false);else H.poseStand(P,1.1,.4,v.phone?'phone':'idle');
if(L.old){P.tPitch+=.1;P.hPitch-=.06;}crowd.begin();crowd.draw(P,L,0);crowd.end();
const targetY=v.sit?.7:L.h*.51,dist=v.umbrella?5.5:4.1;cameras[0].position.set(0,targetY,dist);cameras[0].lookAt(0,targetY,0);cameras[1].position.set(dist,targetY,0);cameras[1].lookAt(0,targetY,0);const headY=(P.pelY+.66)*L.k;cameras[2].position.set(.53,headY+.1,1.6);cameras[2].lookAt(0,headY-.14,0);
document.querySelector('#title').textContent=v.name;document.querySelector('#detail').textContent=`${Math.round(L.h*100)} cm · skinned joints · shaped clothing · ${L.female?'female':'male'} · seed ${v.seed}`;current={v,L,P};render();return {name:v.name,height:L.h,role:L.role,bones:[...crowd.near.values()][0]?.skeleton.bones.length};}
function render(){renderer.setScissorTest(true);for(let i=0;i<3;i++){const x=Math.floor(innerWidth*i/3),w=Math.ceil(innerWidth/3);renderer.setViewport(x,0,w,innerHeight);renderer.setScissor(x,0,w,innerHeight);renderer.render(scene,cameras[i]);}renderer.setScissorTest(false);}
async function benchmark(baselineModule=null){const baseline=!!baselineModule,api=baseline?await import(baselineModule):H;const sc=new THREE.Scene();sc.background=new THREE.Color('#b9c4c9');sc.add(new THREE.HemisphereLight(0xffffff,0x777777,2));const cr=new api.Crowd(sc,150),rng=new RNG(1234),ppl=Array.from({length:150},(_,i)=>({L:api.makeLook(rng,i%5===0?'beach':'street'),P:api.newPose(),d:8+i*1.05}));const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);cam.position.set(0,4,12);cam.lookAt(0,1,-60);renderer.setViewport(0,0,innerWidth,innerHeight);const samples=[],cpu=[],gl=renderer.getContext();let tris,calls;for(let f=0;f<80;f++){const t=performance.now();cr.begin();for(let i=0;i<ppl.length;i++){const p=ppl[i];api.poseWalk(p.P,f*.07+i,1);p.P.x=(i%8-3.5)*1.4;p.P.z=-p.d+8;cr.draw(p.P,p.L,p.d);}cr.end();const tc=performance.now();renderer.render(sc,cam);
// WebGL command submission is asynchronous in Chromium. Wait for the GPU fence
// so the report measures completed frames rather than driver queue throughput.
const fence=gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE,0);gl.flush();
while(gl.clientWaitSync(fence,0,0)===gl.TIMEOUT_EXPIRED)await new Promise(r=>setTimeout(r,1));gl.deleteSync(fence);
if(f>31){samples.push(performance.now()-t);cpu.push(tc-t);}tris=renderer.info.render.triangles;calls=renderer.info.render.calls;if(f%8===0)await new Promise(r=>setTimeout(r,0));}samples.sort((a,b)=>a-b);cpu.sort((a,b)=>a-b);sc.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.skeleton?.dispose();}});render();return {baseline,actors:150,medianMs:samples[24],p95Ms:samples[45],poseMedianMs:cpu[24],triangles:tris,calls,renderer:gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info')?.UNMASKED_RENDERER_WEBGL||gl.RENDERER)};}
async function driver(mode='normal') {
  crowd.begin();crowd.end(); if(window.driverObject){scene.remove(window.driverObject.root);}
  const {Driver}=await import('../src/driver.js');const d=new Driver(mode==='bald'?{hair:false}:mode==='helmet'?{helmet:true}:{});window.driverObject=d;scene.add(d.root);
  if(mode==='roof'){d.hairY=.015;d.hairBase.scale.multiplyScalar(.55);d.curlMesh.scale.setScalar(.3);}
  const wheel={pos:new THREE.Vector3(0,-.135,-.53),angle:.12,euler:new THREE.Euler(-.36,0,0),r:.18};d.update(1/60,1,12,{x:.2,y:0,z:.1},wheel,.1);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(.18,.016,8,48),new THREE.MeshStandardMaterial({color:'#262626'}));rim.position.copy(wheel.pos);rim.rotation.copy(wheel.euler);d.root.add(rim);
  floor.position.y=-.65;cameras[0].position.set(0,-.05,-1.7);cameras[0].lookAt(0,-.07,-.1);cameras[1].position.set(1.7,-.05,0);cameras[1].lookAt(0,-.07,-.1);cameras[2].position.set(.3,.19,-.64);cameras[2].lookAt(0,.15,0);
  document.querySelector('#title').textContent='Driver · '+mode;document.querySelector('#detail').textContent='Wheel grip · seated proportions · face and hair';render();return {curls:d.curls.length,head:d.head.position.toArray(),hairY:d.hairBase?.position.y};
}
window.peopleLab={setup,variants,benchmark,driver,renderer,scene,crowd,current:()=>current};setup(0);window.peopleReady=true;
</script></body></html>
