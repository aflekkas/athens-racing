<!doctype html><html lang="en"><meta charset="utf-8"><title>Enforcement regression fixture</title><style>body{margin:0;background:#10151c;color:white;font:16px system-ui;padding:24px}canvas{background:#263243}button{margin:8px;padding:12px;font:inherit}</style><body class="racing"><h1>Police & Laws regression fixture</h1><p>Fixture camera on the researched Ermou junction; this is NOT a verified post.</p><canvas width="280" height="180"></canvas><button id="camera">Replay camera pass</button><button id="red">Witness red crossing</button><button id="off">Disable laws</button><button id="reset">New race</button><output></output><script type="module">
import { EnforcementRuntime } from '../../src/enforcement-runtime.js';
import { FinePhone, drawCameraIcons } from '../../src/enforcement-hud.js';
const phone=new FinePhone(),out=document.querySelector('output');
const camera={id:'fixture-ermou',mapId:'riviera',s:220,dir:1,limitKmh:50,verified:true,active:true,source:'fixture: NOT verified post'};
const runtime=new EnforcementRuntime(e=>{const f=runtime.record(e);if(f)phone.show(f);out.textContent=`${runtime.ledger.count} fines / +${runtime.ledger.totalSec}s`;});
runtime.setMap({id:'riviera',data:{route:{length:10988},speedCameras:[camera]}});runtime.configure({enabled:true,raceId:'fixture-1'});phone.setEnabled(true);
let now=1;const pose=()=>({s:220,u:2,kmh:90,dir:1,now:now++,at:Date.now()});
document.querySelector('#camera').onclick=()=>runtime.step(pose());
document.querySelector('#red').onclick=()=>runtime.red({s:500,i:1,main:'R',redT:3,toGreen:4},{...pose(),s:500},true);
document.querySelector('#off').onclick=()=>{runtime.configure({enabled:false,raceId:runtime.raceId});phone.setEnabled(false);};
document.querySelector('#reset').onclick=()=>{runtime.reset();phone.reset();out.textContent='New race / 0 fines';};
const g=document.querySelector('canvas').getContext('2d');drawCameraIcons(g,{point:()=>({x:140,z:90})},[camera],12);
window.fixture={runtime,phone};
</script></body></html>
