<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head><body style="margin:0;background:#222"><script type="module">
// Model viewer for checking the procedural cars / traffic from a given angle: ?a=angle(deg)&e=elev
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CARS, CarModel, Driver, TRAFFIC_TYPES, trafficModel } from '../src/cars.js';
import { RNG } from '../src/util.js';
const Q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color('#8fa6b8');
sc.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight('#fff', 2.5); sun.position.set(5, 10, 6); sc.add(sun);
sc.add(new THREE.Mesh(new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#555' })));
let x = -16;
for (const spec of CARS) { const m = new CarModel(spec); m.root.position.set(x, 0, 6); sc.add(m.root); x += 6.5; }
x = -22; const rng = new RNG(3);
for (const t of TRAFFIC_TYPES) { const m = trafficModel(t, t.colors[0], rng); m.root.position.set(x, 0, -4); sc.add(m.root); x += t.bus ? 9 : 6; }
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
const a = (+(Q.get('a') || 30)) * Math.PI / 180, e = (+(Q.get('e') || 18)) * Math.PI / 180, d = +(Q.get('d') || 45);
cam.position.set(Math.sin(a) * Math.cos(e) * d, Math.sin(e) * d, Math.cos(a) * Math.cos(e) * d); cam.lookAt(0, 0.5, 1);
r.render(sc, cam);
</script></body></html>
