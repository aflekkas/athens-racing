name: ATHENS RACING CI
on:
  pull_request:
  push:
    branches: [prod, staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --import ./tools/physics-test/register.mjs tools/physics-test/regress.mjs
      - run: node tools/events-test.mjs
      - run: node tools/ghost-lap.test.mjs
      - run: node tools/check-syntax.mjs
      - run: node tools/check-browser-imports.mjs
      - name: Validate isolated desktop download landing
        run: node apps/landing/check.mjs
  # Hosted game deployment and its cloud-dependent bundle checks are retired.
