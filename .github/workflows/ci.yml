name: ATHENS RACING CI
on:
  pull_request:
  push:
    branches: [prod, staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --import ./tools/physics-test/register.mjs tools/physics-test/regress.mjs
      - run: node tools/events-test.mjs
      - run: node tools/ghost-lap.test.mjs
      - run: node tools/check-syntax.mjs
      - run: node tools/check-browser-imports.mjs
      - name: Validate Cloudflare bundle and asset sizes
        run: npx wrangler deploy --env staging --dry-run
      - name: Install headless browser
        run: npx playwright install --with-deps chromium
      - name: Boot the production menu and race on every map
        run: npm run check:bundle
      - name: Retain private client sourcemaps and bundle metadata
        uses: actions/upload-artifact@v4
        with:
          name: client-debug-${{ github.sha }}-validation
          path: |
            .deploy/sourcemaps/
            .deploy/browser-metafile.json
            .scratch/bundle-check/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
  # Hosted game deployment retired: installers and the isolated static landing replace it.
