name: CI
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --import ./tools/physics-test/register.mjs tools/physics-test/regress.mjs
      - run: node tools/events-test.mjs
      - run: node tools/replay.test.mjs
      - run: node tools/check-syntax.mjs
      - name: Validate Cloudflare bundle and asset sizes
        run: npx wrangler deploy --env staging --dry-run
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deployment credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Cloudflare deployment awaits CLOUDFLARE_API_TOKEN. See deploy/README.md for setup; tests still run.'
          elif [ "$CLOUDFLARE_ACCOUNT_ID" != 'd6f3d2dc5817687a91d74ccd257bad9e' ]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID must be d6f3d2dc5817687a91d74ccd257bad9e'
            exit 1
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.credentials.outputs.ready == 'true'
      - name: Deploy Worker and SQLite Durable Object
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ env.DEPLOY_ENV }}
      - name: Smoke test live deployment
        if: steps.credentials.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node tools/deploy-smoke.mjs "$DEPLOY_URL"
